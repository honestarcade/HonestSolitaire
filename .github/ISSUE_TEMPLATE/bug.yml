name: Bug
description: Something isn't working
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: The version line at the bottom of Settings, e.g. v0.2.0 · BUILD 1021.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: The phone's model, or the emulator's profile and AVD name.
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      description: The Android version, and on Samsung phones the One UI version.
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware or emulator
      options:
        - Hardware
        - Emulator
    validations:
      required: true
