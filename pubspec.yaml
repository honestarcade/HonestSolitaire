name: honest_solitaire
description: "Honest Solitaire — Klondike and Spider, fully offline, for Android."
publish_to: 'none' # never published to pub.dev

version: 0.1.0+1

environment:
  sdk: ^3.13.4
  # A range, not a pin: an exact version here makes `flutter pub get`
  # refuse every other one. The exact version CI uses is in .fvmrc.
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only. It never ships: `flutter build` does not resolve
  # dev_dependencies, and the release bundle is byte-scanned every run
  # (tools/check_aab.sh).
  yaml: ^3.1.4 # why: guards must assert workflow STRUCTURE; a line scan cannot

flutter:
  uses-material-design: true
