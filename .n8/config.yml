version: 1
stack: flutter
initialized: 2026-09-23
wiki: enabled
repo: honestarcade/HonestSolitaire
visibility: public
context7: installed
security_findings: issues
areas: [app, platform, ci, docs]
template: "honestarcade/android-studio-app-template @ 0e56214 — gate, guards, mutation battery, CI/CD and Play runbook"
design_source: "claude.ai/design project 88279a49-c9f2-46fd-996c-c1fa9ca3a41e, file Honest Solitaire.dc.html — splash, menu, Klondike and Spider setup, board, pause/win, statistics, settings, how to play, about the app, about Honest Arcade, brand sheet; prototype game logic; read 2026-09-23"
studio_reference: "/Users/npond/StudioProjects/honest_sudoku — the first app on the template; its M2-M7 shape is the model for this roadmap"
platforms:
  v1: android            # portrait-only; iOS and web deferred to the post-v1 backlog epic
android:
  application_id: com.honestarcade.solitaire   # immutable after the first Play upload
  min_sdk: 24
deployment:
  dev: flutter run on a local device or emulator; signed AAB buildable locally
  stage: Google Play internal testing track, uploaded by CI on a version tag
  production: Google Play production, promoted from the closed test (M7)
  notes: personal Play account — production access needs a closed test with >=12 testers opted in for 14 days
ci:
  provider: github-actions
  on_pr: [analyze, format, test, android-build, bundle-permission-scan, mutation-battery]
  release: "tag v* -> signed AAB -> Google Play internal track"
  secrets_needed: [HS_KEYSTORE_B64, HS_KEYSTORE_PASS, HS_KEY_ALIAS, HS_KEY_PASS, PLAY_SERVICE_ACCOUNT_JSON]
fonts: bundled in the app (Outfit, IBM Plex Mono); never fetched at runtime
games:
  klondike: draw 1 or 3; standard, Vegas or no scoring; unlimited passes
  spider: 1, 2 or 4 suits; two decks; strict or relaxed empty-column deal rule
  deals: generated on device from a seed; optional winnable-only mode backed by an on-device solver
